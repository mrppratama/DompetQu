<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lupa Kata Sandi — DompetQu</title>
  <meta name="description" content="Reset kata sandi akun DompetQu Anda.">
  <meta name="theme-color" content="#111315">
  <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">

  <main class="auth">
    <a href="login.html" class="auth-brand">
      <img src="assets/icons/icon.svg" alt="DompetQu">
      <span>DompetQu</span>
    </a>

    <h1 class="auth-title">Atur Ulang Sandi</h1>
    <p class="auth-subtitle">Masukkan email Anda untuk menerima instruksi pemulihan kata sandi.</p>

    <div id="auth-alert" class="form-error" style="margin-bottom: 16px;" hidden></div>
    <div id="auth-success" class="form-success" style="margin-bottom: 16px;" hidden></div>

    <form id="form-reset" class="form">
      <div class="field">
        <label for="reset-email">Email Terdaftar</label>
        <input type="email" id="reset-email" class="input" placeholder="nama@email.com" required autocomplete="email">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="btn-submit" style="margin-top: 8px;">
        <span>Kirim Email Pemulihan</span>
      </button>
    </form>

    <p class="auth-footer">
      Ingat kata sandi Anda? <a href="login.html">Kembali ke halaman masuk</a>
    </p>
  </main>

  <div class="toast-root" role="region" aria-label="Pemberitahuan"></div>

  <script type="module">
    import { AuthService } from './js/auth.js';
    import { showToast } from './js/notifications.js';
    import { refreshIcons } from './js/utils.js';

    refreshIcons();

    const form = document.getElementById('form-reset');
    const alertEl = document.getElementById('auth-alert');
    const successEl = document.getElementById('auth-success');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.hidden = true;
      successEl.hidden = true;

      const email = document.getElementById('reset-email').value.trim();

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span class="spinner"></span><span>Mengirim...</span>';

      try {
        await AuthService.resetPassword(email);
        successEl.textContent = 'Link pemulihan kata sandi telah dikirim ke email Anda. Silakan periksa kotak masuk atau folder spam.';
        successEl.hidden = false;
        form.reset();
      } catch (err) {
        alertEl.textContent = err.message || 'Gagal mengirim email pemulihan. Pastikan email sudah terdaftar.';
        alertEl.hidden = false;
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Kirim Email Pemulihan</span>';
      }
    });
  </script>
</body>
</html>
